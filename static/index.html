<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bot Głosowy ElevenLabs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1115;
      --card: #18181b;
      --card2: #1e1e23;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --danger: #ef4444;
      --success: #22c55e;
      --muted: #a1a1aa;
      --text: #f4f4f5;
      --border: #27272a;
      --radius: 12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      padding: 8px 0 4px;
    }

    h1 span { color: var(--accent); }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }

    /* Status */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background .3s;
    }
    .dot.connected { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .dot.connecting { background: #facc15; animation: pulse 1s infinite; }
    .dot.error { background: var(--danger); }

    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: .4; }
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background .2s, transform .1s, opacity .2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      flex: 1;
      justify-content: center;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary.active {
      background: var(--danger);
    }
    .btn-primary.active:hover:not(:disabled) { background: #f87171; }

    .btn-secondary {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover:not(:disabled) { background: #2a2a30; }
    .btn-secondary.muted { color: var(--danger); border-color: var(--danger); }

    /* Volume row */
    .inline-controls {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }
    .inline-controls.visible { display: flex; }

    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    label.control-label {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      min-width: 110px;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    input[type=range]::-moz-range-thumb {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }

    .range-value {
      font-size: 0.8rem;
      color: var(--muted);
      min-width: 38px;
      text-align: right;
    }

    /* Context input */
    .context-row {
      display: flex;
      gap: 8px;
    }

    input[type=text] {
      flex: 1;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 13px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color .2s;
    }
    input[type=text]:focus { border-color: var(--accent); }
    input[type=text]::placeholder { color: var(--muted); }

    .btn-send {
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .btn-send:hover:not(:disabled) { background: var(--accent-hover); }

    /* Microphone settings */
    details {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    summary {
      padding: 14px 18px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after {
      content: '▸';
      font-size: 0.75rem;
      color: var(--muted);
      transition: transform .2s;
    }
    details[open] summary::after { transform: rotate(90deg); }

    .details-body {
      padding: 0 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .toggle-label {
      font-size: 0.85rem;
      color: var(--text);
    }
    .toggle-label small {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .toggle {
      position: relative;
      width: 42px; height: 24px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: background .2s;
    }
    .toggle input:checked + .toggle-track { background: var(--accent); }
    .toggle-track::after {
      content: '';
      position: absolute;
      left: 3px; top: 3px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s;
    }
    .toggle input:checked + .toggle-track::after { transform: translateX(18px); }

    /* Conversation log */
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .log-header h2 { font-size: 0.9rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

    .log {
      min-height: 180px;
      max-height: 340px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .log::-webkit-scrollbar { width: 4px; }
    .log::-webkit-scrollbar-track { background: transparent; }
    .log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .log-empty {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      margin-top: 40px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 90%;
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.agent { align-self: flex-start; }

    .msg-bubble {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .msg.user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .msg.agent .msg-bubble {
      background: var(--card2);
      color: var(--text);
      border-bottom-left-radius: 3px;
    }

    .msg-meta {
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0 4px;
    }

    /* Utility */
    .btn-clear {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.78rem;
      cursor: pointer;
      padding: 2px 6px;
    }
    .btn-clear:hover { color: var(--text); }

    @media (max-width: 400px) {
      label.control-label { min-width: 90px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Bot Głosowy <span>ElevenLabs</span></h1>

  <!-- Status + main controls -->
  <div class="card">
    <div class="status-row" style="margin-bottom:14px">
      <div class="dot" id="dot"></div>
      <span id="statusText">Rozłączony</span>
    </div>

    <div class="controls">
      <button class="btn-primary" id="btnStart">▶ Rozpocznij rozmowę</button>
      <button class="btn-secondary" id="btnMute" style="display:none">🎤 Wycisz</button>
    </div>

    <!-- Volume + context (visible during call) -->
    <div class="inline-controls" id="inlineControls">
      <div class="control-row">
        <label class="control-label" for="volumeSlider">🔊 Głośność bota</label>
        <input type="range" id="volumeSlider" min="0" max="100" value="80" />
        <span class="range-value" id="volumeVal">80%</span>
      </div>

      <div class="context-row">
        <input type="text" id="contextInput" placeholder="Wyślij kontekst do bota…" />
        <button class="btn-send" id="btnSendContext">Wyślij</button>
      </div>
    </div>
  </div>

  <!-- Mic settings -->
  <details open>
    <summary>🎩 Ustawienia mikrofonu</summary>
    <div class="details-body">
      <div class="control-row">
        <label class="control-label" for="gainSlider">Czułość mik.</label>
        <input type="range" id="gainSlider" min="0.1" max="3.0" step="0.05" value="1.0" />
        <span class="range-value" id="gainVal">1.0×</span>
      </div>

      <div class="toggle-row">
        <div class="toggle-label">
          Redukcja szumów
          <small>noiseSuppression</small>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggleNoise" checked />
          <span class="toggle-track"></span>
        </label>
      </div>

      <div class="toggle-row">
        <div class="toggle-label">
          Redukcja echa
          <small>echoCancellation</small>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggleEcho" checked />
          <span class="toggle-track"></span>
        </label>
      </div>

      <div class="toggle-row">
        <div class="toggle-label">
          Automatyczna głośność AGC
          <small>autoGainControl</small>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggleAGC" checked />
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>
  </details>

  <!-- Conversation log -->
  <div class="card">
    <div class="log-header">
      <h2>Log rozmowy</h2>
      <button class="btn-clear" id="btnClearLog">Wyczyść</button>
    </div>
    <div class="log" id="log">
      <p class="log-empty" id="logEmpty">Brak wiadomości. Rozpocznij rozmowę.</p>
    </div>
  </div>
</div>

<script type="module">
  import { Conversation } from 'https://cdn.jsdelivr.net/npm/@elevenlabs/client@latest/+esm';

  const btnStart        = document.getElementById('btnStart');
  const btnMute         = document.getElementById('btnMute');
  const btnSendContext  = document.getElementById('btnSendContext');
  const btnClearLog     = document.getElementById('btnClearLog');
  const contextInput    = document.getElementById('contextInput');
  const volumeSlider    = document.getElementById('volumeSlider');
  const volumeVal       = document.getElementById('volumeVal');
  const gainSlider      = document.getElementById('gainSlider');
  const gainVal         = document.getElementById('gainVal');
  const toggleNoise     = document.getElementById('toggleNoise');
  const toggleEcho      = document.getElementById('toggleEcho');
  const toggleAGC       = document.getElementById('toggleAGC');
  const dot             = document.getElementById('dot');
  const statusText      = document.getElementById('statusText');
  const inlineControls  = document.getElementById('inlineControls');
  const log             = document.getElementById('log');
  const logEmpty        = document.getElementById('logEmpty');

  let conversation  = null;
  let muted         = false;
  let audioCtx      = null;
  let gainNode      = null;
  let micStream     = null;
  let processedStream = null;

  function setStatus(state, text) {
    dot.className = 'dot ' + (state || '');
    statusText.textContent = text;
  }

  function showCallControls(show) {
    inlineControls.classList.toggle('visible', show);
    btnMute.style.display = show ? '' : 'none';
  }

  function addMessage(role, text) {
    logEmpty.style.display = 'none';
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (role === 'user' ? 'user' : 'agent');

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = (role === 'user' ? 'Ty' : 'Bot') + ' · ' + new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });

    wrap.appendChild(bubble);
    wrap.appendChild(meta);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  btnClearLog.addEventListener('click', () => {
    log.innerHTML = '';
    logEmpty.style.display = '';
    log.appendChild(logEmpty);
  });

  async function getMicStream() {
    const constraints = {
      audio: {
        noiseSuppression: toggleNoise.checked,
        echoCancellation: toggleEcho.checked,
        autoGainControl:  toggleAGC.checked,
      }
    };

    micStream = await navigator.mediaDevices.getUserMedia(constraints);

    audioCtx = new AudioContext();
    const source = audioCtx.createMediaStreamSource(micStream);
    gainNode = audioCtx.createGain();
    gainNode.gain.value = parseFloat(gainSlider.value);
    const dest = audioCtx.createMediaStreamDestination();

    source.connect(gainNode);
    gainNode.connect(dest);

    processedStream = dest.stream;
    return processedStream;
  }

  function stopMicStream() {
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
    if (audioCtx) {
      audioCtx.close().catch(() => {});
      audioCtx = null;
    }
    gainNode = null;
    processedStream = null;
  }

  gainSlider.addEventListener('input', () => {
    const v = parseFloat(gainSlider.value);
    gainVal.textContent = v.toFixed(2) + '×';
    if (gainNode) gainNode.gain.value = v;
  });

  volumeSlider.addEventListener('input', () => {
    const v = parseInt(volumeSlider.value);
    volumeVal.textContent = v + '%';
    if (conversation) {
      try { conversation.setVolume({ volume: v / 100 }); } catch (_) {}
    }
  });

  btnMute.addEventListener('click', () => {
    if (!conversation) return;
    muted = !muted;
    try {
      if (muted) {
        conversation.setMicMute?.(true);
        if (gainNode) gainNode.gain.value = 0;
      } else {
        conversation.setMicMute?.(false);
        if (gainNode) gainNode.gain.value = parseFloat(gainSlider.value);
      }
    } catch (_) {}
    btnMute.textContent = muted ? '🔇 Odcisz' : '🎤 Wycisz';
    btnMute.classList.toggle('muted', muted);
  });

  btnSendContext.addEventListener('click', sendContext);
  contextInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendContext(); });

  function sendContext() {
    const text = contextInput.value.trim();
    if (!text || !conversation) return;
    try {
      conversation.sendContextualUpdate?.(text);
      addMessage('system-context', '📎 Kontekst wysłany: ' + text);
    } catch (err) {
      console.error('sendContextualUpdate error', err);
    }
    contextInput.value = '';
  }

  btnStart.addEventListener('click', async () => {
    if (conversation) {
      await stopConversation();
    } else {
      await startConversation();
    }
  });

  async function startConversation() {
    setStatus('connecting', 'Łączenie…');
    btnStart.disabled = true;

    try {
      const res = await fetch('/api/signed-url');
      if (!res.ok) throw new Error('Serwer zwrócił błąd ' + res.status);
      const { signed_url } = await res.json();
      if (!signed_url) throw new Error('Brak signed_url w odpowiedzi serwera');

      const stream = await getMicStream();

      const options = {
        signedUrl: signed_url,
        onConnect: () => {
          setStatus('connected', 'Połączono');
          showCallControls(true);
          btnStart.textContent = '⏹ Zakończ rozmowę';
          btnStart.classList.add('active');
          btnStart.disabled = false;
          try { conversation.setVolume({ volume: parseInt(volumeSlider.value) / 100 }); } catch (_) {}
        },
        onDisconnect: () => {
          cleanupAfterCall();
        },
        onError: (err) => {
          console.error('ElevenLabs error', err);
          setStatus('error', 'Błąd: ' + (err?.message || err));
          cleanupAfterCall();
        },
        onMessage: ({ message, source }) => {
          if (source === 'user' || source === 'ai') {
            addMessage(source === 'user' ? 'user' : 'agent', message);
          }
        },
      };

      try {
        options.audioStream = stream;
      } catch (_) {}

      conversation = await Conversation.startSession(options);

    } catch (err) {
      console.error(err);
      setStatus('error', 'Błąd: ' + err.message);
      stopMicStream();
      btnStart.disabled = false;
    }
  }

  async function stopConversation() {
    btnStart.disabled = true;
    try {
      await conversation?.endSession();
    } catch (_) {}
    conversation = null;
    cleanupAfterCall();
  }

  function cleanupAfterCall() {
    stopMicStream();
    conversation = null;
    muted = false;
    setStatus('', 'Rozłączony');
    showCallControls(false);
    btnStart.textContent = '▶ Rozpocznij rozmowę';
    btnStart.classList.remove('active');
    btnStart.disabled = false;
    btnMute.textContent = '🎤 Wycisz';
    btnMute.classList.remove('muted');
  }
</script>
</body>
</html>
